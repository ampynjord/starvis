name: Setup workspace
description: Checkout-aware Node.js setup with dependency and Prisma client caching for the STARVIS monorepo.

inputs:
  node-version:
    description: Node.js version to install.
    default: '22'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Restore dependencies and Prisma client
      id: deps-cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          api/node_modules
          ihm/node_modules
          extractor/node_modules
          bot/node_modules
          db/node_modules
          extensions/rsi-hangar-sync/node_modules
          db/generated
        key: deps-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('package-lock.json', 'db/prisma/schema/**') }}
        restore-keys: |
          deps-${{ runner.os }}-node${{ inputs.node-version }}-

    # On an exact cache hit, node_modules and the gitignored Prisma client
    # (db/generated, rebuilt by the db postinstall) are restored, so the slow
    # `npm ci` + `prisma generate` is skipped entirely. On a miss, npm ci runs
    # and its postinstall regenerates the Prisma client.
    - name: Install dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit

    # Sur un cache exact, `npm ci` est saute — et avec lui la seule verification
    # que le lockfile est coherent avec les package.json. Une desynchronisation
    # reste alors invisible jusqu'a ce qu'un changement de cle force une vraie
    # installation, potentiellement des semaines plus tard.
    #
    # C'est exactement ce qui est arrive le 22 septembre 2026 : le lockfile
    # portait `@types/node@22.20.1` la ou l'arbre en demandait 22.20.4, et la CI
    # est restee verte jusqu'a ce qu'une modification du schema Prisma change la
    # cle de cache.
    #
    # Le controle coute moins d'une seconde et ne s'execute que dans le cas ou
    # l'installation n'a pas eu lieu.
    - name: Verify lockfile is in sync
      if: steps.deps-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npm ci --dry-run
