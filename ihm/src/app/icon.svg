<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082238" />
      <stop offset="100%" stop-color="#020b14" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Orbit Rings -->
  <g transform="translate(16, 16)">
    <!-- Central Core -->
    <circle cx="0" cy="0" r="2.75" fill="#22d3ee" />
    
    <!-- Orbit 1 (Tilted 45deg) -->
    <ellipse cx="0" cy="0" rx="9" ry="3.8" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.9" transform="rotate(-30)" />
    
    <!-- Orbit 2 (Tilted -45deg) -->
    <ellipse cx="0" cy="0" rx="9" ry="3.8" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" transform="rotate(50)" />
  </g>

  <!-- Telemetry Beacon Point -->
  <circle cx="26" cy="6" r="2" fill="#38bdf8" filter="url(#cyanGlow)" />
</svg>
